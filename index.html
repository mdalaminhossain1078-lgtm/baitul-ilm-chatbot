      const low = text.toLowerCase();
      const sugg =
        low.includes("বাতিল") ? ["👤 সদস্য হওয়ার শর্ত", "📚 বই ধারের শর্ত", "📞 যোগাযোগ করুন"] :
        low.includes("সদস্য") ? ["📝 নিবন্ধন ফর্ম", "💚 দাতা সদস্য", "📚 বই ধারের শর্ত"] :
        low.includes("বই") ? ["📗 ইসলামিক বই", "📘 উপন্যাস", "📔 আত্মউন্নয়ন"] :
        low.includes("রক্ত") ? ["📞 যোগাযোগ করুন", "👤 সদস্য হতে চাই"] :
        ["👤 সদস্যপদ", "📚 বইসমূহ", "📞 যোগাযোগ করুন"];

      const showContact =
        low.includes("যোগাযোগ") || low.includes("নম্বর") || low.includes("ফোন") ||
        low.includes("ইমেইল") || low.includes("whatsapp") || low.includes("ফেসবুক") ||
        low.includes("ওয়েবসাইট") || low.includes("পরিচিতি") || low.includes("পাঠাগার সম্পর্কে") ||
        low.includes("দাতা") || low.includes("বই ধার") || low.includes("অবস্থান") ||
        low.includes("কোথায়") || low.includes("ঠিকানা") || low.includes("বই দান");

      const showBlood = low.includes("রক্ত");
      const showMember = low.includes("সদস্য") && !low.includes("বাতিল") && !low.includes("দাতা");

      setMessages(p => [...p, { role: "bot", text: reply, sugg, showContact, showBlood, showMember }]);
    } catch (e) {
      setMessages(p => [...p, { role: "bot", text: "দুঃখিত, সংযোগে সমস্যা হচ্ছে। একটু পরে আবার চেষ্টা করুন। 🙏" }]);
    }
    setLoading(false);
  }

  return (
    <div style={{ fontFamily: "Arial,sans-serif", background: `linear-gradient(160deg,${C.dark} 0%,#1a5c35 100%)`, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 12 }}>
      <div style={{ width: "100%", maxWidth: 460, background: "#fff", borderRadius: 24, overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.4)", display: "flex", flexDirection: "column", height: "95vh", maxHeight: 740 }}>

        {/* Header */}
        <div style={{ background: `linear-gradient(135deg,${C.dark} 0%,${C.main} 100%)`, padding: "14px 16px", display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
          <div style={{ width: 48, height: 48, borderRadius: "50%", overflow: "hidden", flexShrink: 0, border: `2.5px solid ${C.gold}`, position: "relative", background: `linear-gradient(135deg,${C.goldD},${C.gold})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22 }}>
            📚
            <div style={{ position: "absolute", bottom: 2, right: 2, width: 11, height: 11, background: "#2ecc71", borderRadius: "50%", border: `2px solid ${C.dark}` }} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.gold, lineHeight: 1.35 }}>নন্দলালপুর বায়তুল ইলম ইসলামিক পাঠাগার</div>
            <div style={{ fontSize: 10.5, color: "rgba(255,255,255,0.65)", marginTop: 2 }}>🕌 পোরজনা, শাহজাদপুর, সিরাজগঞ্জ</div>
          </div>
          <div style={{ textAlign: "center" }}>
            <div style={{ background: "rgba(245,208,104,0.2)", border: `1px solid rgba(245,208,104,0.4)`, borderRadius: 20, padding: "3px 10px", fontSize: 10, color: C.gold, fontWeight: 600 }}>🤖 AI</div>
            <div style={{ fontSize: 9, color: "rgba(255,255,255,0.5)", marginTop: 3 }}>ইলম সহায়ক</div>
          </div>
        </div>

        {/* Bismillah Banner */}
        <div style={{ background: `linear-gradient(90deg,${C.dark},${C.main},${C.dark})`, padding: "7px 16px", textAlign: "center" }}>
          <div style={{ fontSize: 12, color: C.gold, fontWeight: 600, letterSpacing: 1 }}>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
        </div>

        {/* Quick Chips */}
        <div style={{ background: "#fdf8ee", padding: "8px 12px", borderBottom: "1px solid #ede8d0", display: "flex", gap: 6, overflowX: "auto", flexShrink: 0, scrollbarWidth: "none" }}>
          {chips.map(([label, msg], i) => (
            <button key={i} onClick={() => send(msg)}
              style={{ background: "#fff", border: `1.5px solid ${C.goldD}`, borderRadius: 20, padding: "5px 12px", fontSize: 11, color: C.main, cursor: "pointer", whiteSpace: "nowrap", fontWeight: 600, flexShrink: 0, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
              {label}
            </button>
          ))}
        </div>

        {/* Chat Area */}
        <div ref={chatRef} style={{ flex: 1, overflowY: "auto", padding: "14px 12px", display: "flex", flexDirection: "column", gap: 10, background: "#f5f7f5", minHeight: 0 }}>
          <div style={{ textAlign: "center", fontSize: 10.5, color: "#bbb", marginBottom: 4 }}>
            ✦ আজকের আলোচনা ✦
          </div>
          {messages.map((m, i) => (
            <div key={i} className="msg-anim">
              <div style={{ display: "flex", alignItems: "flex-end", gap: 8, flexDirection: m.role === "user" ? "row-reverse" : "row" }}>
                {m.role === "bot" && (
                  <div style={{ width: 32, height: 32, borderRadius: "50%", background: `linear-gradient(135deg,${C.main},${C.goldD})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, flexShrink: 0, boxShadow: "0 2px 6px rgba(0,0,0,0.15)" }}>
                    📚
                  </div>
                )}
                <div style={{
                  maxWidth: "78%", padding: "11px 14px", borderRadius: 18,
                  fontSize: 13.5, lineHeight: 1.7, whiteSpace: "pre-wrap", wordBreak: "break-word",
                  background: m.role === "user" ? `linear-gradient(135deg,${C.main},${C.light})` : "#fff",
                  color: m.role === "user" ? "#fff" : "#1a1a1a",
                  borderBottomLeftRadius: m.role === "bot" ? 4 : 18,
                  borderBottomRightRadius: m.role === "user" ? 4 : 18,
                  boxShadow: m.role === "user" ? "0 3px 10px rgba(21,93,50,0.3)" : "0 2px 8px rgba(0,0,0,0.08)",
                }}>
                  {m.text}
                </div>
              </div>
              {m.showContact && <ContactCard />}
              {m.showBlood && <BloodCard />}
              {m.showMember && !m.showContact && <MemberCard />}
              {m.sugg && m.sugg.length > 0 && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginLeft: m.role === "bot" ? 40 : 0, marginTop: 6 }}>
                  {m.sugg.map((s, j) => (
                    <button key={j} onClick={() => send(s)}
                      style={{ background: "#fff", border: `1.5px solid ${C.light}`, color: C.main, borderRadius: 20, padding: "5px 13px", fontSize: 12, cursor: "pointer", fontWeight: 600, boxShadow: "0 1px 4px rgba(0,0,0,0.08)" }}>
                      {s}
                    </button>
                  ))}
                </div>
              )}
            </div>
          ))}
          {loading && (
            <div style={{ display: "flex", alignItems: "flex-end", gap: 8 }}>
              <div style={{ width: 32, height: 32, borderRadius: "50%", background: `linear-gradient(135deg,${C.main},${C.goldD})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, boxShadow: "0 2px 6px rgba(0,0,0,0.15)" }}>📚</div>
              <div style={{ background: "#fff", borderRadius: 18, borderBottomLeftRadius: 4, padding: "12px 16px", boxShadow: "0 2px 8px rgba(0,0,0,0.08)", display: "flex", gap: 5, alignItems: "center" }}>
                {[0, 0.2, 0.4].map((d, i) => (
                  <div key={i} className="typing-dot" style={{ width: 8, height: 8, background: C.main, borderRadius: "50%", animationDelay: `${d}s`, opacity: 0.7 }} />
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Input Area */}
        <div style={{ background: "#fff", padding: "10px 12px", borderTop: "1px solid #eee", display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
          <input
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && send(input)}
            placeholder="যেকোনো প্রশ্ন বাংলায় লিখুন..."
            style={{ flex: 1, background: "#f5f5f5", border: `1.5px solid #e0e0e0`, borderRadius: 24, padding: "10px 16px", fontSize: 13, outline: "none", fontFamily: "Arial,sans-serif" }}
          />
          <button
            onClick={() => send(input)}
            disabled={loading || !input.trim()}
            style={{ width: 42, height: 42, background: `linear-gradient(135deg,${C.main},${C.light})`, border: "none", borderRadius: "50%", color: "#fff", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, opacity: (loading || !input.trim()) ? 0.5 : 1, boxShadow: "0 3px 10px rgba(21,93,50,0.3)" }}>
            ➤
          </button>
        </div>

        {/* Footer */}
        <div style={{ background: C.dark, padding: "6px 16px", textAlign: "center" }}>
          <div style={{ fontSize: 10, color: "rgba(245,208,104,0.6)" }}>❝ ইলমই আলো, ইলমই শক্তি ❞ • নন্দলালপুর বায়তুল ইলম</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
